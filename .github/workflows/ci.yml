name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         os: darwin, arch: arm64 }
          - { runner: macos-15-intel,   os: darwin, arch: x64 }
          - { runner: ubuntu-24.04,     os: linux,  arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64 }
          # macos-14 was retired on 2026-11-02. macos-15-intel is GitHub's
          # last Intel image, supported until the macOS 15 image retires
          # (fall 2027). After that, build darwin-x64 on macos-15 with
          # CC="cc -arch x86_64" CXX="c++ -arch x86_64"; that cross-build
          # works and its binary runs under Rosetta. Keep this matrix in step
          # with release.yml.
    runs-on: ${{ matrix.runner }}
    env:
      # Keep the published minimum at macOS 14.0, which is what the macos-14
      # builds shipped. Without it the runner's SDK raises it. Linux ignores it.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build indexer
        run: make -f Makefile.indexer indexer
      - name: Version smoke test
        run: ./tests/smoke_version.sh ./build/c/cortex-indexer
      - name: Check macOS architecture and minimum version
        if: matrix.os == 'darwin'
        run: sh scripts/check-macos-binary.sh build/c/cortex-indexer "${{ matrix.arch }}" "$MACOSX_DEPLOYMENT_TARGET"
      - name: C test suite (non-gating baseline)
        run: |
          make -f Makefile.indexer test \
            || echo "::warning::C suite has known failures (baseline); rehabilitation tracked separately"
